name: Limbo ARM64 baseline build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'limbo-android-lib/**'
      - 'limbo-android-x86/**'
      - 'limbo-android-arm/**'
      - 'limbo-android-ppc/**'
      - 'limbo-android-sparc/**'
      - 'scripts/ci/**'
      - '.github/workflows/limbo-arm64-baseline.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: limbo-arm64-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-baseline:
    name: QEMU 5.1.0 / ARM64 Android host / x86_64 guest
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      BUILD_THREADS: '2'

    steps:
      - name: Check out fork
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3 ndk;23.1.7779620'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bison build-essential curl flex gettext \
            libtool libtool-bin make patch perl pkg-config python3 rsync texinfo \
            python-is-python3 unzip wget xz-utils zip

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.0.2'
          cache-provider: basic

      - name: Prepare pinned Limbo external sources and patches
        run: ./scripts/ci/prepare-limbo-sources.sh

      - name: Build native libraries and x86 APK
        run: ./scripts/ci/build-limbo-arm64-x86.sh

      - name: Upload baseline APK and native libraries
        uses: actions/upload-artifact@v6
        with:
          name: limbo-arm64-x86-baseline-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/*.apk
            limbo-android-lib/src/main/jniLibs/arm64-v8a/**/*.so
            limbo-android-x86/src/main/jniLibs/arm64-v8a/**/*.so
          retention-days: 14
